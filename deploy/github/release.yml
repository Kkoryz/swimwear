# Release workflow for one site repository (sync-template-core copies it to .github/workflows/release.yml).
# Runs the site's gates, then uploads the release build and switches the live symlink on the server atomically
# (deploy/server/site-release.sh). A blocked preflight stops the release; nothing is uploaded.
# Repository settings:
#   secrets  DEPLOY_SSH_KEY (a deploy-only key), DEPLOY_KNOWN_HOSTS (ssh-keyscan output of the server)
#   vars     DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH (the registry's deploy_path, e.g. /var/www/strandmill.com)
# Rollback: run this workflow with "rollback" ticked, or on the server: site-release.sh rollback <DEPLOY_PATH>.
# A release whose live check fails is rolled back at once; every rollback is checked live too.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback:
        description: Make the previous release live again (no build)
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    # Settings reach the shell as environment variables, never pasted into the script text (a value with a quote or
    # $( ) in it would otherwise run as shell code).
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: SSH access to the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Roll back
        if: ${{ inputs.rollback }}
        run: ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "sh $DEPLOY_PATH/site-release.sh rollback $DEPLOY_PATH"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Gates (tests, template, astro check, build, SEO audit)
        if: ${{ !inputs.rollback }}
        run: pnpm check

      - name: Release build and preflight
        if: ${{ !inputs.rollback }}
        run: |
          pnpm build:release
          pnpm preflight

      - name: Upload and go live
        if: ${{ !inputs.rollback }}
        run: |
          release="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          target="$DEPLOY_USER@$DEPLOY_HOST"
          ssh -i ~/.ssh/deploy_key "$target" "mkdir -p $DEPLOY_PATH/releases/$release"
          rsync -az -e "ssh -i ~/.ssh/deploy_key" deploy/server/site-release.sh "$target:$DEPLOY_PATH/site-release.sh"
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" dist/ "$target:$DEPLOY_PATH/releases/$release/"
          ssh -i ~/.ssh/deploy_key "$target" "sh $DEPLOY_PATH/site-release.sh activate $DEPLOY_PATH $release"

      - name: Check the live site
        id: live
        run: pnpm verify:live

      - name: Tell IndexNow what changed (Bing and others)
        if: ${{ success() && !inputs.rollback }}
        continue-on-error: true
        run: pnpm indexnow

      - name: Roll back a release that fails its live check
        if: ${{ failure() && steps.live.conclusion == 'failure' && !inputs.rollback }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "sh $DEPLOY_PATH/site-release.sh rollback $DEPLOY_PATH"
          pnpm verify:live
