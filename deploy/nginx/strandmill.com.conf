# Generated by scripts/build-nginx-config.mjs for strandmill.com. Serves the Astro build as static files.
# Install: copy to /etc/nginx/sites-available/strandmill.com.conf, copy the headers snippet to /etc/nginx/snippets/strandmill.com-headers.conf,
# link into sites-enabled, then: nginx -t && systemctl reload nginx. The certificate must cover both strandmill.com and www.strandmill.com.
# "listen ... http2" works on the nginx that Ubuntu LTS ships (1.24); nginx 1.25.1+ accepts it with a deprecation notice.

# http (both hosts) and https://www redirect permanently to the one canonical origin.
server {
    listen 80;
    listen [::]:80;
    server_name strandmill.com www.strandmill.com;
    return 301 https://strandmill.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.strandmill.com;
    ssl_certificate /etc/letsencrypt/live/strandmill.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/strandmill.com/privkey.pem;
    return 301 https://strandmill.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name strandmill.com;
    ssl_certificate /etc/letsencrypt/live/strandmill.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/strandmill.com/privkey.pem;

    root /var/www/strandmill.com/current;
    index index.html;
    absolute_redirect off;
    include /etc/nginx/snippets/strandmill.com-headers.conf;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml application/manifest+json;
    # With the ngx_brotli module installed: brotli on; brotli_types <same types>;

    # Directory URLs end in a slash (/path -> 301 /path/), matching the canonical URLs.
    location / {
        try_files $uri $uri/ =404;
    }

    # Pages revalidate on every visit (ETag); new builds show at once.
    location ~* \.html$ {
        include /etc/nginx/snippets/strandmill.com-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Fingerprinted build assets never change (^~: wins over the file-type rule below).
    location ^~ /_astro/ {
        include /etc/nginx/snippets/strandmill.com-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Photos, icons and fonts: cached, revalidated after 30 days.
    location ~* \.(?:webp|avif|png|jpe?g|svg|ico|woff2?)$ {
        include /etc/nginx/snippets/strandmill.com-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
    }

    location = /site.webmanifest {
        include /etc/nginx/snippets/strandmill.com-headers.conf;
        default_type application/manifest+json;
    }

    # First-party API on the same origin (enquiry form endpoint, attribution); no CORS, no third-party host.
    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 404 /404.html;
}
