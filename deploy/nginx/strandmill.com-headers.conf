# Security headers for strandmill.com (included in every location: a location's add_header replaces the server's).
# No includeSubDomains: other services (Directus, Umami, Listmonk) may run on subdomains with their own TLS setup.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
